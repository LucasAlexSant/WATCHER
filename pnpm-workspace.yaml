# agora-agents 2.14.0 calls ConvoAITokenBuilder.buildToken with the 12-argument signature of
# agora-token 2.0.6. agora-token 2.0.7 shortened that signature, so the role lands in the
# token-expiry slot and every REST call fails with 401 "Token is expired".
# Remove this pin once agora-agents works with agora-token >= 2.0.7.
overrides:
  'agora-agents>agora-token': 2.0.6

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
